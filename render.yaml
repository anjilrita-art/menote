services:
  - type: web
    name: studyhub
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: GITHUB_RAW_REPO
        value: anjilrita-art/menote
      - key: GITHUB_RAW_BRANCH
        value: main
